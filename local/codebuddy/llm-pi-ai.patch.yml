# CodeBuddy route: an OpenAI-compatible bridge in front of `codebuddy --serve`.
# The bridge runs the agent loop on its own side, so `defaultSupportsTools: false`
# withholds tool schemas and the prompt's tool section from every model here.
# Merge into ~/.dsh/profiles/<profile>/cordis.patch.yml, or pass as --patch.
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      codebuddy-local:
        apiKeyEnv: BRIDGE_API_KEY
        displayName: CodeBuddy
        api: openai-completions
        baseURL: http://127.0.0.1:8000/v1
        defaultSupportsTools: false
        defaultContextWindow: 200000
        defaultMaxTokens: 32768
        streamIdleTimeoutMs: 600000
        models:
          - id: claude-sonnet-5
          - id: claude-sonnet-4.6
          - id: claude-opus-5.5
          - id: gpt-6-astra
          - id: gpt-5.6-sol
          - id: gemini-3.1-pro
          - id: glm-5.3-ioa
          - id: kimi-k3-ioa
          - id: deepseek-v4-pro-ioa
          - id: hy3-ioa
          - id: hy4std
          - id: minimax-m3-ioa
